<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Masada - OREMRD</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #111; color: #eee; font-family: 'Roboto', sans-serif; margin: 0; padding: 0; }
        .radio-page-wrap { max-width: 800px; margin: 80px auto 40px; padding: 0 20px; }
        .radio-header { text-align: center; margin-bottom: 30px; }
        .radio-header h1 { color: #f90; font-family: 'Oswald', sans-serif; font-size: 36px; margin: 0; }
        .radio-header p { color: #aaa; font-size: 14px; }
        .radio-live-panel { background: #1a1a2e; border-radius: 16px; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .radio-live-player { display: block; width: min(640px, 100%); height: 44px; margin: 0 auto; }
        .radio-status-text { text-align: center; color: #4caf50; font-size: 14px; margin-top: 10px; }
        .radio-status-text.offline { color: #f44336; }
        .site-header { background: #222; color: #fff; padding: 15px 0; position: fixed; top: 0; left: 0; width: 100%; z-index: 100; box-shadow: 0 2px 16px rgba(0,0,0,0.5); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo a { color: #f90; font-family: 'Oswald', sans-serif; font-size: 24px; text-decoration: none; }
        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { color: #ddd; text-decoration: none; font-size: 14px; }
        .nav-links a.active { color: #f90; }
        .nav-links a:hover { color: #fff; }
        .site-footer { background: #222; color: #aaa; text-align: center; padding: 20px; margin-top: 60px; font-size: 13px; }
        .site-footer a { color: #f90; text-decoration: none; }
        .menu-toggle { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        @media (max-width: 768px) {
            .nav-links { display: none; flex-direction: column; position: absolute; top: 60px; left: 0; width: 100%; background: #222; padding: 20px; }
            .nav-links.show { display: flex; }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="logo"><a href="index.html">OREMRD</a></div>
            <nav class="main-nav">
                <button class="menu-toggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
                <ul class="nav-links">
                    <li><a href="index.html">INICIO</a></li>
                    <li><a href="nosotros.html">NOSOTROS</a></li>
                    <li><a href="radio.html" class="active">RADIO</a></li>
                    <li><a href="contacto.html">CONTACTO</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="radio-page-wrap">
        <div class="radio-header">
            <h1>Radio Masada</h1>
            <p>Somos un canal cristiano evangélico — Dios te Bendiga</p>
        </div>

        <div class="radio-live-panel">
            <audio
                id="main-radio-audio"
                class="radio-live-player"
                controls
                preload="none"
                src="https://uk5freenew.listen2myradio.com/live.mp3?typeportmount=s1_23756_stream_375931828"
            >
                Tu navegador no soporta audio HTML5.
            </audio>
            <div class="radio-status-text" id="radioStatusText">Presiona Play para escuchar</div>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 <a href="index.html">OREMRD</a> — Organizacion Evangelica Misionera</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
