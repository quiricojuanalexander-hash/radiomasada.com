<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Radio Masada</title>

<style>
body {
    background: #0d0d0d;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 50px;
}

.player {
    background: #1a1a1a;
    padding: 20px;
    border-radius: 15px;
    width: 300px;
    margin: auto;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

button {
    background: #00c853;
    border: none;
    padding: 10px 20px;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #00e676;
}

h2 {
    margin-bottom: 10px;
}
</style>

</head>
<body>

<div class="player">
    <h2>📻 Radio Masada</h2>
    <audio id="radio" controls preload="none" src="https://uk26freenew.listen2myradio.com/live.mp3?typeportmount=s1_10571_stream_721181640">
        Tu navegador no soporta audio.
    </audio>

    <br>

    <button onclick="playRadio()">▶ Play</button>
    <button onclick="pauseRadio()">⏸ Pause</button>
</div>

<script>
function playRadio() {
    document.getElementById("radio").play();
}

function pauseRadio() {
    document.getElementById("radio").pause();
}
</script>

</body>
</html>
